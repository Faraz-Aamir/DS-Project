<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="850" viewBox="0 0 1180 850" role="img" aria-labelledby="title desc">
  <title id="title">Vault Heist benchmark charts</title>
  <desc id="desc">Log-scale comparisons of BST and AVL height, search comparisons, and heap timings.</desc>
  <rect width="1180" height="850" fill="#ffffff"/>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#263238}.title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#546e7a}.panel{font-size:18px;font-weight:700}.axis{font-size:12px;fill:#546e7a}.value{font-size:12px;font-weight:600}.grid{stroke:#dce3e8;stroke-width:1}.axisline{stroke:#607d8b;stroke-width:1.2}.bst{fill:#2878b5}.avl{fill:#2a9d68}.build{stroke:#2878b5;fill:#2878b5}.sort{stroke:#e07a24;fill:#e07a24}
  </style>
  <text x="48" y="42" class="title">Vault Heist — benchmark summary</text>
  <text x="48" y="64" class="subtitle">GCC 16.2 · -O2 · fixed seed 20261111 · times are five-run medians</text>

  <text x="55" y="104" class="panel">Tree height at 10,000 nodes</text>
  <text x="620" y="104" class="panel">Average search comparisons at 10,000 nodes</text>
  <!-- shared log-scale grid for the upper charts -->
  <g>
    <line x1="125" y1="145" x2="535" y2="145" class="grid"/><text x="97" y="149" class="axis">10,000</text>
    <line x1="125" y1="193" x2="535" y2="193" class="grid"/><text x="106" y="197" class="axis">1,000</text>
    <line x1="125" y1="241" x2="535" y2="241" class="grid"/><text x="112" y="245" class="axis">100</text>
    <line x1="125" y1="289" x2="535" y2="289" class="grid"/><text x="112" y="293" class="axis">10</text>
    <line x1="125" y1="337" x2="535" y2="337" class="grid"/><text x="117" y="341" class="axis">1</text>
    <line x1="125" y1="145" x2="125" y2="337" class="axisline"/><line x1="125" y1="337" x2="535" y2="337" class="axisline"/>
    <rect x="205" y="145" width="58" height="192" class="bst"/><text x="207" y="138" class="value">9,999</text>
    <rect x="267" y="283" width="58" height="54" class="avl"/><text x="281" y="276" class="value">13</text>
    <rect x="365" y="267" width="58" height="70" class="bst"/><text x="381" y="260" class="value">29</text>
    <rect x="427" y="280" width="58" height="57" class="avl"/><text x="443" y="273" class="value">15</text>
    <text x="221" y="360" class="axis">Sorted</text><text x="384" y="360" class="axis">Random</text>
    <rect x="180" y="379" width="12" height="12" class="bst"/><text x="198" y="390" class="axis">BST</text>
    <rect x="244" y="379" width="12" height="12" class="avl"/><text x="262" y="390" class="axis">AVL</text>
  </g>
  <g>
    <line x1="700" y1="145" x2="1125" y2="145" class="grid"/><text x="672" y="149" class="axis">10,000</text>
    <line x1="700" y1="193" x2="1125" y2="193" class="grid"/><text x="681" y="197" class="axis">1,000</text>
    <line x1="700" y1="241" x2="1125" y2="241" class="grid"/><text x="687" y="245" class="axis">100</text>
    <line x1="700" y1="289" x2="1125" y2="289" class="grid"/><text x="687" y="293" class="axis">10</text>
    <line x1="700" y1="337" x2="1125" y2="337" class="grid"/><text x="692" y="341" class="axis">1</text>
    <line x1="700" y1="145" x2="700" y2="337" class="axisline"/><line x1="700" y1="337" x2="1125" y2="337" class="axisline"/>
    <rect x="780" y="145" width="58" height="192" class="bst"/><text x="778" y="138" class="value">9,979</text>
    <rect x="842" y="271" width="58" height="66" class="avl"/><text x="846" y="264" class="value">23.7</text>
    <rect x="950" y="265" width="58" height="72" class="bst"/><text x="954" y="258" class="value">32.5</text>
    <rect x="1012" y="271" width="58" height="66" class="avl"/><text x="1016" y="264" class="value">24.2</text>
    <text x="796" y="360" class="axis">Sorted</text><text x="969" y="360" class="axis">Random</text>
    <rect x="755" y="379" width="12" height="12" class="bst"/><text x="773" y="390" class="axis">BST</text>
    <rect x="819" y="379" width="12" height="12" class="avl"/><text x="837" y="390" class="axis">AVL</text>
  </g>

  <text x="55" y="445" class="panel">Heap operation time by input size (random input, log scale)</text>
  <text x="55" y="465" class="subtitle">Median nanoseconds · each point is the median of five runs</text>
  <g>
    <line x1="135" y1="510" x2="1090" y2="510" class="grid"/><text x="75" y="514" class="axis">10,000,000</text>
    <line x1="135" y1="559" x2="1090" y2="559" class="grid"/><text x="82" y="563" class="axis">1,000,000</text>
    <line x1="135" y1="608" x2="1090" y2="608" class="grid"/><text x="89" y="612" class="axis">100,000</text>
    <line x1="135" y1="657" x2="1090" y2="657" class="grid"/><text x="96" y="661" class="axis">10,000</text>
    <line x1="135" y1="705" x2="1090" y2="705" class="grid"/><text x="96" y="709" class="axis">1,000</text>
    <line x1="135" y1="510" x2="135" y2="705" class="axisline"/><line x1="135" y1="705" x2="1090" y2="705" class="axisline"/>
    <polyline points="230,705 600,651 970,597" fill="none" stroke="#2878b5" stroke-width="3"/>
    <circle cx="230" cy="705" r="5" class="build"/><circle cx="600" cy="651" r="5" class="build"/><circle cx="970" cy="597" r="5" class="build"/>
    <text x="203" y="692" class="value">1,000</text><text x="573" y="638" class="value">13,000</text><text x="936" y="584" class="value">164,000</text>
    <polyline points="230,675 600,614 970,554" fill="none" stroke="#e07a24" stroke-width="3"/>
    <circle cx="230" cy="675" r="5" class="sort"/><circle cx="600" cy="614" r="5" class="sort"/><circle cx="970" cy="554" r="5" class="sort"/>
    <text x="202" y="670" class="value">4,000</text><text x="573" y="601" class="value">77,000</text><text x="936" y="541" class="value">1,148,000</text>
    <text x="218" y="730" class="axis">100</text><text x="582" y="730" class="axis">1,000</text><text x="944" y="730" class="axis">10,000</text>
    <text x="560" y="750" class="axis">Input elements</text>
    <line x1="780" y1="770" x2="810" y2="770" stroke="#2878b5" stroke-width="3"/><text x="818" y="774" class="axis">Bottom-up build</text>
    <line x1="950" y1="770" x2="980" y2="770" stroke="#e07a24" stroke-width="3"/><text x="988" y="774" class="axis">Heap Sort</text>
  </g>
</svg>
